name: inventory
type: php
php_version: "8.3"
database:
  type: postgres
  version: "17"
nodejs_version: "22"
webserver_type: nginx-fpm

hooks:
  post-start:
    - exec: composer install
    # The Pest suite runs against real Postgres (the `db` service) on a database
    # of its own, so driver-specific behaviour — strict GROUP BY, type coercion,
    # row locking — is exercised by the suite rather than assumed.
    - exec: psql -h db -U db -d db -tc "SELECT 1 FROM pg_database WHERE datname = 'testing'" | grep -q 1 || psql -h db -U db -d db -c "CREATE DATABASE testing"
