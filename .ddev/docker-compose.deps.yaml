# Mounts the sibling first-party packages into the web container so the composer
# PATH repositories ("../taxon" and "../vendor-pkg", resolved relative to
# /var/www/html) resolve to /var/www/taxon and /var/www/vendor-pkg inside the
# container during local development.
#
# Note the directory/name split: the package named robinsonryan/vendor lives in a
# directory called `vendor-pkg` so it cannot be confused with composer's vendor/.
services:
  web:
    volumes:
      - "../../taxon:/var/www/taxon"
      - "../../vendor-pkg:/var/www/vendor-pkg"
